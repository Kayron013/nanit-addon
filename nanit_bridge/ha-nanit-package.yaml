# Nanit Bridge — Home Assistant MQTT entities (manual fallback)
# ------------------------------------------------------------------
# Since add-on 1.1.0 the bridge publishes MQTT discovery configs and
# the mqtt: section below is NOT needed — entities appear automatically.
# Use it only with the `mqtt_discovery: false` option (never both: the
# duplicate unique_ids will conflict). The camera: block at the bottom
# is still relevant — MQTT discovery cannot describe an RTMP camera
# (or add it via UI: Generic Camera integration).
#
# 1. Find your BABY_UID in the add-on dashboard or add-on log.
# 2. Replace all occurrences of BABY_UID below.
# 3. If you changed mqtt_topic_prefix, replace the leading "nanit".
# 4. Drop this file in /config/packages/ (with packages enabled) or
#    merge into your mqtt: block, then reload MQTT entities.
#
# Published payloads are raw strings: floats for temperature/humidity,
# "true"/"false" for booleans. Command topics accept "true"/"false".

mqtt:
  sensor:
    - name: "Nursery Temperature"
      unique_id: nanit_BABY_UID_temperature
      state_topic: "nanit/babies/BABY_UID/temperature"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "Nursery Humidity"
      unique_id: nanit_BABY_UID_humidity
      state_topic: "nanit/babies/BABY_UID/humidity"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement

  binary_sensor:
    - name: "Nursery Night Mode"
      unique_id: nanit_BABY_UID_is_night
      state_topic: "nanit/babies/BABY_UID/is_night"
      payload_on: "true"
      payload_off: "false"

    - name: "Nanit Stream Alive"
      unique_id: nanit_BABY_UID_stream_alive
      state_topic: "nanit/babies/BABY_UID/is_stream_alive"
      payload_on: "true"
      payload_off: "false"
      device_class: connectivity

  switch:
    - name: "Nanit Night Light"
      unique_id: nanit_BABY_UID_night_light
      state_topic: "nanit/babies/BABY_UID/night_light"
      command_topic: "nanit/babies/BABY_UID/night_light/switch"
      payload_on: "true"
      payload_off: "false"
      state_on: "true"
      state_off: "false"
      icon: mdi:lightbulb-night

    - name: "Nanit Standby"
      unique_id: nanit_BABY_UID_standby
      state_topic: "nanit/babies/BABY_UID/standby"
      command_topic: "nanit/babies/BABY_UID/standby/switch"
      payload_on: "true"
      payload_off: "false"
      state_on: "true"
      state_off: "false"
      icon: mdi:video-off

# Camera: recommended setup is the go2rtc pattern in DOCS.md; this HLS
# entity is the fallback. Never use the RTMP URL with Generic Camera.
camera:
  - platform: ffmpeg
    name: Nursery Camera
    input: http://HOST_IP:8080/api/stream/hls/BABY_UID/playlist.m3u8
